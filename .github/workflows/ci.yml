name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fantaly
          POSTGRES_USER: fantaly
          POSTGRES_PASSWORD: fantaly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantaly -d fantaly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: fantaly
      DJANGO_DB_USER: fantaly
      DJANGO_DB_PASSWORD: fantaly
      DJANGO_DB_HOST: localhost
      DJANGO_DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt

      - name: Django checks
        run: |
          python manage.py check

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          python manage.py test